name: Database Migration

# Applies pending Prisma migrations to the production database.
#
# Running the migration here (rather than at app deploy time) lets us:
#   - serialize runs (concurrency group) so two migrations never race,
#   - gate behind the "Production" GitHub Environment (required reviewers +
#     scoped secrets + an auditable run history),
#   - decouple migration failures from the app deploy.
#
# Ordering note: this workflow and the app deploy both run on push to `main`,
# so they are not strictly ordered. Migrations MUST therefore be backward
# compatible (expand/contract): ship additive changes first, deploy code that
# tolerates both old and new schema, and only drop/rename in a later release.
# This makes deploy order irrelevant and keeps rollbacks safe.
#
# Required configuration:
#   secrets.DATABASE_URL     - production Postgres connection string, defined
#     in the "Production" GitHub Environment.
#   secrets.PROD_DIRECT_URL  - direct (non-pooled) connection string, used by
#     Prisma for migrations. Same as DATABASE_URL if there is no pooler.

on:
    push:
        branches: [main]
        # Only run when migrations or the schema actually change.
        paths:
            - 'prisma/migrations/**'
            - 'prisma/schema.prisma'
            - '.github/workflows/database-migrate.yml'
    # Allow manual re-runs from the Actions tab if needed.
    workflow_dispatch:

# Never run two production migrations at the same time.
concurrency:
    group: database-migrate
    cancel-in-progress: false

jobs:
    migrate:
        name: Migrate Database
        runs-on: ubuntu-latest
        # Scopes the prod secrets and enables environment protection rules.
        environment: Production
        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Prisma migrations against production
              run: npx prisma migrate deploy
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  DIRECT_URL: ${{ secrets.DIRECT_URL }}
